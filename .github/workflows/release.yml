name: release

# Creates the release PR via just-release. On push to main, just-release
# analyzes commits since the last release and opens (or updates) a
# `release/YYYY-MM-DD` PR with the new version + changelogs. Merging that PR
# lands a `release: X.Y.Z` commit on main, which triggers `publish.yml`.
#
# Manual prerelease entry: workflow_dispatch with `prerelease=alpha` (or beta,
# rc) graduates a stable repo into a prerelease cycle. Once the first
# prerelease lands, every subsequent push to main auto-bumps the counter — no
# need to dispatch again. To graduate back to stable, push a commit with a
# `Release-As: stable` footer.

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      prerelease:
        description: 'Start a prerelease cycle (alpha/beta/rc). Empty = normal release.'
        required: false
        default: ''

permissions:
  contents: write
  pull-requests: write

jobs:
  release-pr:
    name: create release PR
    runs-on: ubuntu-latest
    # Skip on the release commit itself (squash merge of release branch) or
    # on a regular merge commit of a release branch — those are handled by
    # publish.yml, not this workflow.
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (!startsWith(github.event.head_commit.message, 'release:') &&
       !(startsWith(github.event.head_commit.message, 'Merge') && contains(github.event.head_commit.message, 'release/')))
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0  # full history so just-release can find the last release commit
      - uses: actions/setup-node@v6
        with:
          node-version: '22.14'
      - uses: oven-sh/setup-bun@v2
      - name: Install dependencies
        run: bun install --ignore-scripts --no-save
      - name: Run just-release
        run: bunx just-release
        env:
          CI: 1
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Empty on push events; only set when manually dispatching to enter
          # a prerelease cycle from a stable version.
          JUST_RELEASE_PRERELEASE: ${{ github.event.inputs.prerelease }}
