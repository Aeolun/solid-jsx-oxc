name: build

on:
  pull_request:
  # Pushes to main are handled by publish.yml's build matrix on release
  # commits, and the prior PR run already verified the build on every other
  # commit — so no separate push-to-main smoke build is needed here.

permissions:
  contents: read

env:
  MACOSX_DEPLOYMENT_TARGET: '10.13'

jobs:
  build:
    name: build (${{ matrix.settings.target }})
    runs-on: ubuntu-latest
    # Hard ceiling so a hung Microsoft CDN download (or any other stall)
    # fails fast instead of burning the full 6-hour default. Cross-compiles
    # complete in 5–15 min; 30 leaves plenty of headroom.
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        settings:
          - target: x86_64-apple-darwin
            flags: '-x'
          - target: aarch64-apple-darwin
            flags: '-x'
          - target: x86_64-pc-windows-msvc
            flags: '-x'
          - target: aarch64-pc-windows-msvc
            flags: '-x'
          - target: x86_64-unknown-linux-gnu
            flags: '--use-napi-cross'
          - target: aarch64-unknown-linux-gnu
            flags: '--use-napi-cross'
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.settings.target }}
      - uses: mlugg/setup-zig@v2
        with:
          version: 0.13.0
      - uses: taiki-e/install-action@v2
        env:
          GITHUB_TOKEN: ${{ github.token }}
        with:
          tool: cargo-zigbuild,cargo-xwin
      - uses: actions/setup-node@v6
        with:
          node-version: 20
      - uses: oven-sh/setup-bun@v2
      - name: Install deps
        run: bun install --ignore-scripts --no-save
      # cargo-xwin downloads ~700MB of MSVC CRT/headers from Microsoft on
      # first invocation. Cache it so windows targets don't re-download
      # every run (and aren't blocked when Microsoft's CDN slows down).
      - name: Cache xwin (Windows targets only)
        if: contains(matrix.settings.target, 'windows')
        uses: actions/cache@v5
        with:
          path: ~/.cache/cargo-xwin
          key: xwin-${{ runner.os }}-v1
      - name: Build native addon
        working-directory: packages/solid-jsx-oxc
        env:
          # Verbose logging from xwin / cargo-xwin so download events surface
          # in the build log (in addition to the heartbeat below).
          XWIN_LOG: info
          RUST_LOG: cargo_xwin=info,xwin=info
        run: |
          set -e

          # Heartbeat: every 20 s, print cache size + recent download host
          # connections. Lets us distinguish "still downloading slowly" from
          # "actually hung" without having to wait for the 30-min timeout.
          (
            while sleep 20; do
              ts=$(date -u +%H:%M:%S)
              if [ -d ~/.cache/cargo-xwin ]; then
                size=$(du -sh ~/.cache/cargo-xwin 2>/dev/null | awk '{print $1}')
                echo "::notice::[heartbeat $ts] xwin cache: ${size:-?}"
              else
                echo "::notice::[heartbeat $ts] xwin cache: <not yet created>"
              fi
            done
          ) &
          HEARTBEAT_PID=$!
          # Make sure the heartbeat dies with this step, even on early failure.
          trap 'kill $HEARTBEAT_PID 2>/dev/null || true' EXIT

          bunx @napi-rs/cli build --platform --release --features napi --no-js --dts binding.d.ts \
            --target ${{ matrix.settings.target }} ${{ matrix.settings.flags }}
