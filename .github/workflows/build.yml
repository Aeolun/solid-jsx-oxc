name: build

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

env:
  MACOSX_DEPLOYMENT_TARGET: '10.13'

jobs:
  build:
    name: build (${{ matrix.settings.target }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        settings:
          - target: x86_64-apple-darwin
            flags: '-x'
          - target: aarch64-apple-darwin
            flags: '-x'
          - target: x86_64-pc-windows-msvc
            flags: '-x'
          - target: aarch64-pc-windows-msvc
            flags: '-x'
          - target: x86_64-unknown-linux-gnu
            flags: '--use-napi-cross'
          - target: aarch64-unknown-linux-gnu
            flags: '--use-napi-cross'
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.settings.target }}
      - uses: mlugg/setup-zig@v2
        with:
          version: 0.13.0
      - uses: taiki-e/install-action@v2
        env:
          GITHUB_TOKEN: ${{ github.token }}
        with:
          tool: cargo-zigbuild,cargo-xwin
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: oven-sh/setup-bun@v2
      - name: Install deps
        run: bun install --ignore-scripts
      - name: Build native addon
        working-directory: packages/solid-jsx-oxc
        run: |
          bunx @napi-rs/cli build --platform --release --features napi --no-js --dts binding.d.ts \
            --target ${{ matrix.settings.target }} ${{ matrix.settings.flags }}
